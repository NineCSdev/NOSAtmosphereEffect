name: Android Beta Release

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Extract build metadata
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F\" '{print $2}')
          echo "Found version name: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build all beta variants
        run: |
          ./gradlew \
            assembleV36PlayRelease \
            assembleV36FdroidRelease \
            assembleV33PlayRelease \
            assembleV33FdroidRelease \
            bundleV35PlayRelease

      - name: Verify model isolation and APK sizes
        shell: bash
        run: |
          set -euo pipefail

          APK_16_MLKIT="app/build/outputs/apk/v36Play/release/app-v36-play-release-unsigned.apk"
          APK_16_FOSS="app/build/outputs/apk/v36Fdroid/release/app-v36-fdroid-release-unsigned.apk"
          APK_13_MLKIT="app/build/outputs/apk/v33Play/release/app-v33-play-release-unsigned.apk"
          APK_13_FOSS="app/build/outputs/apk/v33Fdroid/release/app-v33-fdroid-release-unsigned.apk"
          AAB_15_MLKIT="app/build/outputs/bundle/v35PlayRelease/app-v35-play-release.aab"

          assert_no_foss_payload() {
            local archive="$1"
            local listing="$RUNNER_TEMP/$(basename "$archive").contents"
            unzip -Z1 "$archive" > "$listing"
            if grep -Eq '(^|/)assets/models/|libtensorflowlite_jni\.so' "$listing"; then
              echo "FOSS model/runtime leaked into ML Kit artifact: $archive"
              exit 1
            fi
          }

          assert_has_foss_payload() {
            local archive="$1"
            local listing="$RUNNER_TEMP/$(basename "$archive").contents"
            unzip -Z1 "$archive" > "$listing"
            grep -Eq '(^|/)assets/models/u2netp_320x320\.tflite$' "$listing"
            grep -Eq '(^|/)lib/arm64-v8a/libtensorflowlite_jni\.so$' "$listing"
          }

          assert_no_foss_payload "$APK_16_MLKIT"
          assert_no_foss_payload "$APK_13_MLKIT"
          assert_no_foss_payload "$AAB_15_MLKIT"
          assert_has_foss_payload "$APK_16_FOSS"
          assert_has_foss_payload "$APK_13_FOSS"

          APK_16_MLKIT_SIZE=$(stat -c%s "$APK_16_MLKIT")
          APK_16_FOSS_SIZE=$(stat -c%s "$APK_16_FOSS")
          APK_13_MLKIT_SIZE=$(stat -c%s "$APK_13_MLKIT")
          APK_13_FOSS_SIZE=$(stat -c%s "$APK_13_FOSS")
          MAX_MLKIT_APK_SIZE=$((10 * 1024 * 1024))

          if (( APK_16_MLKIT_SIZE >= APK_16_FOSS_SIZE )); then
            echo "Android 16 ML Kit APK is not smaller than its FOSS APK."
            exit 1
          fi
          if (( APK_13_MLKIT_SIZE >= APK_13_FOSS_SIZE )); then
            echo "Android 13 ML Kit APK is not smaller than its FOSS APK."
            exit 1
          fi
          if (( APK_16_MLKIT_SIZE >= MAX_MLKIT_APK_SIZE || APK_13_MLKIT_SIZE >= MAX_MLKIT_APK_SIZE )); then
            echo "An ML Kit APK exceeded the 10 MiB size guard."
            exit 1
          fi

          {
            echo "### Beta artifact sizes"
            echo '```text'
            du -h "$APK_16_MLKIT" "$APK_16_FOSS" "$APK_13_MLKIT" "$APK_13_FOSS" "$AAB_15_MLKIT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign Android 16+ ML Kit APK
        uses: ilharp/sign-android-release@v2
        id: sign_16_mlkit
        with:
          releaseDir: app/build/outputs/apk/v36Play/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 16+ FOSS APK
        uses: ilharp/sign-android-release@v2
        id: sign_16_foss
        with:
          releaseDir: app/build/outputs/apk/v36Fdroid/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 13+ ML Kit APK
        uses: ilharp/sign-android-release@v2
        id: sign_13_mlkit
        with:
          releaseDir: app/build/outputs/apk/v33Play/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 13+ FOSS APK
        uses: ilharp/sign-android-release@v2
        id: sign_13_foss
        with:
          releaseDir: app/build/outputs/apk/v33Fdroid/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 15+ Play Store AAB
        uses: ilharp/sign-android-release@v2
        id: sign_15_mlkit
        with:
          releaseDir: app/build/outputs/bundle/v35PlayRelease
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Name beta artifacts
        run: |
          mv "${{ steps.sign_16_mlkit.outputs.signedFile }}" ./atmo-engine-beta-android-16-plus-mlkit.apk
          mv "${{ steps.sign_16_foss.outputs.signedFile }}" ./atmo-engine-beta-android-16-plus-foss.apk
          mv "${{ steps.sign_13_mlkit.outputs.signedFile }}" ./atmo-engine-beta-android-13-plus-mlkit.apk
          mv "${{ steps.sign_13_foss.outputs.signedFile }}" ./atmo-engine-beta-android-13-plus-foss-fdroid.apk
          mv "${{ steps.sign_15_mlkit.outputs.signedFile }}" ./atmo-engine-beta-playstore-android-15-plus-mlkit.aab
          sha256sum \
            atmo-engine-beta-android-16-plus-mlkit.apk \
            atmo-engine-beta-android-16-plus-foss.apk \
            atmo-engine-beta-android-13-plus-mlkit.apk \
            atmo-engine-beta-android-13-plus-foss-fdroid.apk \
            atmo-engine-beta-playstore-android-15-plus-mlkit.aab \
            > SHA256SUMS-beta.txt

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-beta.${{ github.run_number }}
          name: Beta v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            atmo-engine-beta-android-16-plus-mlkit.apk
            atmo-engine-beta-android-16-plus-foss.apk
            atmo-engine-beta-android-13-plus-mlkit.apk
            atmo-engine-beta-android-13-plus-foss-fdroid.apk
            atmo-engine-beta-playstore-android-15-plus-mlkit.aab
            SHA256SUMS-beta.txt
